services:
  db:
    mem_limit: 1536m
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - log_min_duration_statement=750
      - -c
      - log_lock_waits=on
  app:
    mem_limit: 1024m
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx640m
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,metrics
