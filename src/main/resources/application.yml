spring:
  application:
    name: account-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:55432}/${DB_NAME:accounts}
    username: ${DB_APP_USER:account_app}
    password: ${DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  flyway:
    user: ${DB_OWNER_USER:account_owner}
    password: ${DB_OWNER_PASSWORD}
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  session:
    timeout: 30m
    store-type: jdbc
    jdbc:
      initialize-schema: never
  thymeleaf:
    cache: true
server:
  address: 127.0.0.1
  port: 8443
  shutdown: graceful
  forward-headers-strategy: none
  ssl:
    enabled: true
    key-store: ${TLS_KEY_STORE:file:.local/dev.p12}
    key-store-type: PKCS12
    key-store-password: ${TLS_PASSWORD}
    key-alias: accounts-local
    enabled-protocols: TLSv1.3,TLSv1.2
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        name: ACCOUNT_SESSION
        http-only: true
        secure: true
        same-site: lax
        path: /
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
account:
  http:
    enabled: true
    port: 8080
logging:
  file:
    name: .local/logs/account-service.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
