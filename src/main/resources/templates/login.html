<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"><title>Вход — Лицевые счета</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="card"><h1>Сервис лицевых счетов</h1>
  <p>Войдите под своей учетной записью.</p>
  <p class="alert" th:if="${param.error}">Неверный логин или пароль.</p>
  <p class="notice" th:if="${param.logout}">Вы вышли из системы.</p>
  <p class="alert" th:if="${param.expired}">Сеанс завершен. Войдите повторно.</p>
  <form method="post" th:action="@{/login}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label for="username">Логин</label><input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Пароль</label><input id="password" type="password" name="password" autocomplete="current-password" required>
    <button type="submit">Войти</button>
  </form>
</main></body></html>
