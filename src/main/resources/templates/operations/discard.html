<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Отбросить черновик', false)}"></head>
<body><div th:replace="~{fragments/layout :: shell('Отбросить черновик', 'operations', ~{::main})}"><main id="main-content" class="page-content">

    <div class="page-heading"><div><h1>Отбросить черновик?</h1><p class="text-secondary">Проверьте документ перед удалением.</p></div></div>
    <section class="card form-card"><div class="card-body"><dl class="details-list"><div><dt>Счёт</dt><dd th:text="${account.accountNumber}"></dd></div><div><dt>Сумма</dt><dd class="money" th:text="${@ui.money(operation.amount)}"></dd></div><div><dt>Основание</dt><dd th:text="${operation.basis}"></dd></div></dl>
        <div class="alert alert-warning" role="note">Черновик будет удалён. Действие сохранится в журнале, сальдо останется прежним.</div>
        <form method="post" th:action="@{/operations/{id}/discard(id=${operation.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="token" th:value="${pending.token}"><div class="action-bar form-actions"><button class="btn btn-danger" type="submit">Подтвердить удаление черновика</button><a class="btn btn-outline-secondary" th:href="@{/operations/{id}(id=${operation.id})}">Вернуться к черновику</a></div></form>
    </div></section>
</main></div></body></html>
