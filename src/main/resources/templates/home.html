<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"><title>Главная — Лицевые счета</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="card"><h1>Сервис лицевых счетов</h1>
  <p>Вы вошли как <strong th:text="${name}">Пользователь</strong>.</p>
  <p>Роль: <span th:switch="${role}"><span th:case="'ADMIN'">Администратор</span><span th:case="'OPERATOR'">Оператор</span><span th:case="'ACCOUNTANT'">Бухгалтер-расчетчик</span><span th:case="'MANAGER'">Руководитель</span><span th:case="'CLIENT'">Клиент</span></span></p>
  <nav><a th:if="${role == 'ADMIN'}" th:href="@{/admin/users}">Пользователи</a>
    <a th:if="${role == 'ADMIN' or role == 'MANAGER'}" th:href="@{/audit}">Журнал действий</a>
    <a th:if="${role != 'CLIENT'}" th:href="@{/clients}">Клиенты</a>
    <a th:if="${role == 'CLIENT'}" th:href="@{/me/client}">Моя карточка</a>
    <a th:if="${role == 'CLIENT'}" th:href="@{/my/accounts}">Мои счета</a>
    <a th:if="${role != 'CLIENT'}" th:href="@{/accounts}">Счета</a></nav>
  <p>Сейчас доступно открытие и сопровождение лицевых счетов. Денежные операции появятся на следующем этапе.</p>
  <form method="post" th:action="@{/logout}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button type="submit">Выйти</button>
  </form>
</main></body></html>
