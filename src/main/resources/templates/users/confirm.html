<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Подтверждение доступа', false)}"></head>
<body><div th:replace="~{fragments/layout :: shell('Подтверждение доступа', 'users', ~{::main})}"><main id="main-content" class="page-content">

    <div class="page-heading"><div><h1>Подтвердите изменение доступа</h1><p class="text-secondary" th:text="${user.login}"></p></div></div>
    <section class="card form-card"><div class="card-body">
        <div class="confirmation-summary"><section><h2>Сейчас</h2><dl class="details-list"><div><dt>Роль</dt><dd th:text="${user.roleName}"></dd></div><div><dt>Статус</dt><dd th:text="${@ui.status(user.status)}"></dd></div></dl></section><section><h2>После изменения</h2><dl class="details-list"><div><dt>Роль</dt><dd th:text="${roleNames.get(pending.roleCode)}"></dd></div><div><dt>Статус</dt><dd><span class="status-pill" th:attr="data-status=${pending.status}" th:text="${@ui.status(pending.status)}"></span></dd></div><div><dt>Клиент</dt><dd th:text="${pending.clientId == null ? 'Без привязки' : selectedClientName}"></dd></div></dl></section></div>
        <dl class="details-list"><div><dt>Причина</dt><dd th:text="${pending.reason}"></dd></div></dl>
        <div class="alert alert-warning" role="note">Действующие сеансы пользователя завершатся после подтверждения.</div>
        <form method="post" th:action="@{/admin/users/{id}/confirm(id=${user.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="token" th:value="${pending.token}"><div class="action-bar form-actions"><button class="btn btn-primary" type="submit">Подтвердить изменение</button><a class="btn btn-outline-secondary" th:href="@{/admin/users/{id}/edit(id=${user.id})}">Вернуться без изменения</a></div></form>
    </div></section>
</main></div></body></html>
