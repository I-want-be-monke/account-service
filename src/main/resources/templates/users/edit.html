<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Пользователь</title>
<link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="wide">
<nav><a th:href="@{/admin/users}">Пользователи</a></nav><h1 th:text="|Пользователь: ${user.login}|"></h1>
<p class="notice" th:if="${param.updated}">Данные сохранены.</p>
<p>Роль: <strong th:text="${user.roleName}"></strong> · Статус: <strong th:text="${user.status == 'ACTIVE' ? 'Активен' : 'Заблокирован'}"></strong></p>
<p th:if="${user.clientId}">ID клиента: <code th:text="${user.clientId}"></code></p>
<section><h2>Учетные данные</h2><p class="alert" th:if="${formError}" th:text="${formError}"></p>
<form method="post" th:action="@{/admin/users/{id}/edit(id=${user.id})}" th:object="${form}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{version}">
<label for="login">Логин</label><input id="login" th:field="*{login}" maxlength="100" required>
<label for="fullName">Имя</label><input id="fullName" th:field="*{fullName}" maxlength="200" required>
<button type="submit">Сохранить данные</button></form></section>
<section><h2>Роль и доступ</h2><p>Изменение требует подтверждения и завершит действующие сеансы пользователя.</p>
<p class="alert" th:if="${accessError}" th:text="${accessError}"></p>
<form method="post" th:action="@{/admin/users/{id}/prepare(id=${user.id})}" th:object="${accessForm}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{version}">
<label for="roleCode">Новая роль</label><select id="roleCode" th:field="*{roleCode}"><option th:each="r : ${roles}" th:value="${r.code}" th:text="${r.displayName}"></option></select>
<label for="status">Новый статус</label><select id="status" th:field="*{status}"><option value="ACTIVE">Активен</option><option value="BLOCKED">Заблокирован</option></select>
<label for="clientId">ID клиента (только для роли «Клиент»)</label><input id="clientId" th:field="*{clientId}">
<label for="reason">Причина *</label><input id="reason" th:field="*{reason}" maxlength="500" required>
<button type="submit">Перейти к подтверждению</button></form></section>
</main></body></html>
