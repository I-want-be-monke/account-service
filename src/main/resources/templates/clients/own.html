<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Моя карточка</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="wide"><nav><a th:href="@{/}">Главная</a></nav><h1>Моя карточка клиента</h1>
<dl><dt>Имя / наименование</dt><dd th:text="${client.displayName}"></dd><dt>Идентификатор</dt><dd th:text="|${client.identifierType}: ${client.identifierValue}|"></dd><dt>Телефон</dt><dd th:text="${client.phone == null ? 'Не указан' : client.phone}"></dd><dt>Электронная почта</dt><dd th:text="${client.email == null ? 'Не указана' : client.email}"></dd><dt>Статус</dt><dd th:text="${client.status == 'ACTIVE' ? 'Активен' : 'Архив'}"></dd></dl></main></body></html>
