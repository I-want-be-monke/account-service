<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Клиенты', false)}"></head>
<body><div th:replace="~{fragments/layout :: shell('Клиенты', 'clients', ~{::main})}"><main id="main-content" class="page-content">

    <div class="page-heading"><div><h1>Клиенты</h1><p class="text-secondary">Поиск, контактные данные и лицевые счета.</p></div><a class="btn btn-primary" th:if="${isOperator}" th:href="@{/clients/new}">Создать клиента</a></div>
    <section class="card"><div class="card-body"><form class="filter-grid" method="get" th:action="@{/clients}">
        <div class="form-field"><label class="form-label" for="name">Название или ФИО</label><input class="form-control" id="name" name="name" th:value="${name}" maxlength="200" placeholder="Начните вводить имя"></div>
        <div class="form-field"><label class="form-label" for="type">Тип клиента</label><select class="form-select" id="type" name="type"><option value="">Все типы</option><option value="PERSON" th:selected="${type == 'PERSON'}">Физическое лицо</option><option value="ORGANIZATION" th:selected="${type == 'ORGANIZATION'}">Организация</option></select></div>
        <div class="form-field"><label class="form-label" for="identifier">Идентификатор</label><input class="form-control" id="identifier" name="identifier" th:value="${identifier}" maxlength="100"></div>
        <div class="form-field"><label class="form-label" for="accountNumber">Номер счета</label><input class="form-control" id="accountNumber" name="accountNumber" th:value="${accountNumber}" maxlength="32" placeholder="LS-0000000001"></div>
        <div class="form-field"><label class="form-label" for="status">Статус</label><select class="form-select" id="status" name="status"><option value="">Все статусы</option><option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Активен</option><option value="ARCHIVED" th:selected="${status == 'ARCHIVED'}">Архив</option></select></div>
        <div class="action-bar filter-actions"><button class="btn btn-primary" type="submit">Найти</button><a th:replace="~{fragments/ui :: button(@{/clients}, 'Сбросить', 'outline-secondary')}"></a></div>
    </form></div></section>
    <section class="card card-table"><div class="card-header"><h2 class="card-title">Результаты поиска</h2><span class="text-secondary" th:text="|Найдено ${clients.totalElements}|"></span></div><div class="table-responsive" tabindex="0" role="region" aria-label="Результаты поиска"><table class="table table-vcenter"><thead><tr><th scope="col">Имя / название</th><th scope="col">Тип</th><th scope="col">Идентификатор</th><th scope="col">Статус</th><th scope="col">Карточка</th></tr></thead><tbody>
        <tr th:each="c : ${clients.content}"><td><a class="fw-semibold" th:href="@{/clients/{id}(id=${c.id})}" th:text="${c.displayName}"></a></td><td th:text="${c.clientType == 'PERSON' ? 'Физическое лицо' : 'Организация'}"></td><td th:text="|${c.identifierType} · ${c.identifierValue}|"></td><td><span th:replace="~{fragments/ui :: status(${c.status})}"></span></td><td><a class="btn btn-outline-secondary btn-sm" th:href="@{/clients/{id}(id=${c.id})}">Открыть</a></td></tr>
        <tr th:if="${clients.empty}"><td colspan="5"><div class="empty-state"><h3>Клиенты не найдены</h3><p>Измените условия поиска или сбросьте фильтры.</p><a th:replace="~{fragments/ui :: button(@{/clients}, 'Сбросить фильтры', 'outline-secondary')}"></a></div></td></tr>
    </tbody></table></div><div class="card-footer" th:with="previous=${clients.hasPrevious()} ? @{/clients(name=${name},type=${type},identifier=${identifier},status=${status},accountNumber=${accountNumber},page=${clients.number - 1})} : ${null}, next=${clients.hasNext()} ? @{/clients(name=${name},type=${type},identifier=${identifier},status=${status},accountNumber=${accountNumber},page=${clients.number + 1})} : ${null}">
        <nav th:replace="~{fragments/ui :: pager(${previous}, ${next}, ${clients.number}, ${clients.totalPages})}"></nav>
    </div></section>
</main></div></body></html>
