<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Подтверждение статуса</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="wide"><nav><a th:href="@{/clients/{id}(id=${client.id})}">Отмена</a></nav><h1>Подтвердите изменение</h1><p>Клиент: <strong th:text="${client.displayName}"></strong></p><p>Действие: <strong th:text="${pending.status == 'ARCHIVED' ? 'Перевести в архив' : 'Восстановить'}"></strong></p><p>Причина: <span th:text="${pending.reason}"></span></p><form method="post" th:action="@{/clients/{id}/confirm(id=${client.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="token" th:value="${pending.token}"><button type="submit">Подтвердить</button></form></main></body></html>
