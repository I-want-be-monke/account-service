<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Статус клиента</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="wide"><nav><a th:href="@{/clients/{id}(id=${client.id})}">К карточке</a></nav><h1>Изменение статуса клиента</h1><p th:text="${client.displayName}"></p><p class="alert" th:if="${formError}" th:text="${formError}"></p>
<form method="post" th:action="@{/clients/{id}/status(id=${client.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="version" th:value="${client.version}">
<label>Новый статус<select name="status" required><option th:if="${client.status == 'ACTIVE'}" value="ARCHIVED">В архив</option><option th:if="${client.status == 'ARCHIVED'}" value="ACTIVE">Восстановить</option></select></label>
<label>Причина<input name="reason" required maxlength="500"></label><button type="submit">Продолжить</button></form></main></body></html>
