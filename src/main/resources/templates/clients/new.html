<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Новый клиент</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="wide"><nav><a th:href="@{/clients}">К списку клиентов</a></nav><h1>Создание клиента</h1><p class="alert" th:if="${formError}" th:text="${formError}"></p>
<form method="post" th:action="@{/clients/new}" th:object="${form}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<label>Тип клиента<select th:field="*{clientType}" required><option value="">Выберите тип</option><option value="PERSON">Физическое лицо</option><option value="ORGANIZATION">Организация</option></select></label>
<label>ФИО или наименование<input th:field="*{displayName}" maxlength="200" required></label>
<label>Тип идентификатора<input th:field="*{identifierType}" maxlength="32" placeholder="PASSPORT / INN / DEMO" required></label>
<label>Значение идентификатора<input th:field="*{identifierValue}" maxlength="100" required></label>
<label>Телефон<input th:field="*{phone}" maxlength="32"></label><label>Электронная почта<input th:field="*{email}" maxlength="254" type="email"></label>
<button type="submit">Создать</button></form></main></body></html>
