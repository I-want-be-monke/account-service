<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Состояние счёта', false)}"></head>
<body><div th:replace="~{fragments/layout :: shell('Состояние счёта', 'accounts', ~{::main})}"><main id="main-content" class="page-content">
    <div class="page-heading"><div><h1>Смена состояния</h1><p class="text-secondary" th:text="${account.accountNumber}"></p></div><a class="btn btn-outline-secondary" th:href="@{/accounts/{id}(id=${account.id})}">К счету</a></div>
    <div class="alert alert-danger" role="alert" th:if="${formError}" th:text="${formError}"></div>
    <section class="card form-card"><div class="card-body">
        <dl class="details-list"><div><dt>Текущее состояние</dt><dd><span class="status-pill" th:attr="data-status=${account.status}" th:text="${@ui.status(account.status)}"></span></dd></div><div><dt>Текущее сальдо</dt><dd class="money" th:text="${@ui.money(account.currentBalance)}"></dd></div></dl>
        <form method="post" th:action="@{/accounts/{id}/status(id=${account.id})}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="version" th:value="${account.version}">
            <div class="form-grid"><div class="form-field"><label class="form-label" for="status">Новый статус</label><select class="form-select" id="status" name="status" required><option value="">Выберите действие</option><option th:if="${account.status == 'OPEN'}" value="SUSPENDED" th:selected="${selectedStatus == 'SUSPENDED'}">Приостановить</option><option th:if="${account.status == 'SUSPENDED'}" value="OPEN" th:selected="${selectedStatus == 'OPEN'}">Возобновить</option><option th:if="${account.status != 'CLOSED'}" value="CLOSED" th:selected="${selectedStatus == 'CLOSED'}">Закрыть</option></select></div><div class="form-field"><label class="form-label" for="reason">Причина</label><input class="form-control" id="reason" name="reason" th:value="${reason}" maxlength="500" required placeholder="Укажите причину изменения"></div></div>
            <div class="alert alert-info" role="note">Закрытие возможно при нулевом сальдо. Закрытый счёт нельзя открыть повторно.</div>
            <div class="action-bar form-actions"><button class="btn btn-primary" type="submit">Продолжить</button><a class="btn btn-outline-secondary" th:href="@{/accounts/{id}(id=${account.id})}">Отмена</a></div>
        </form>
    </div></section>
</main></div></body></html>
