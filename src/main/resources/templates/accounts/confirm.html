<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Подтверждение состояния', false)}"></head>
<body><div th:replace="~{fragments/layout :: shell('Подтверждение состояния', 'accounts', ~{::main})}"><main id="main-content" class="page-content">
    <div class="page-heading"><div><h1>Подтвердите смену состояния</h1><p class="text-secondary">Проверьте выбранный счёт, статус и причину.</p></div></div>
    <section class="card form-card"><div class="card-body"><dl class="details-list"><div><dt>Счёт</dt><dd th:text="${account.accountNumber}"></dd></div><div><dt>Текущий статус</dt><dd th:text="${@ui.status(account.status)}"></dd></div><div><dt>Новый статус</dt><dd><span class="status-pill" th:attr="data-status=${pending.status}" th:text="${@ui.status(pending.status)}"></span></dd></div><div><dt>Причина</dt><dd th:text="${pending.reason}"></dd></div></dl>
        <form method="post" th:action="@{/accounts/{id}/confirm(id=${account.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="token" th:value="${pending.token}"><div class="action-bar form-actions"><button class="btn btn-primary" type="submit">Подтвердить</button><a class="btn btn-outline-secondary" th:href="@{/accounts/{id}(id=${account.id})}">Отмена</a></div></form>
    </div></section>
</main></div></body></html>
