<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Подтверждение</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="wide">
<nav><a th:href="@{/accounts/{id}(id=${account.id})}">Отмена</a></nav><h1>Подтвердите смену состояния</h1>
<p>Счёт: <strong th:text="${account.accountNumber}"></strong></p><p>Новый статус: <strong th:text="${pending.status == 'OPEN' ? 'Открыт' : (pending.status == 'SUSPENDED' ? 'Приостановлен' : 'Закрыт')}"></strong></p>
<p>Причина: <span th:text="${pending.reason}"></span></p>
<form method="post" th:action="@{/accounts/{id}/confirm(id=${account.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="token" th:value="${pending.token}"><button type="submit">Подтвердить</button></form>
</main></body></html>
