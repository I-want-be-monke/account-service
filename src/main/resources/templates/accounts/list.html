<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Лицевые счета</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="wide">
<nav><a th:href="@{/}">Главная</a> <a th:href="@{/clients}">Клиенты</a></nav><h1>Лицевые счета</h1>
<form class="filters" method="get" th:action="@{/accounts}"><label>Номер счета<input name="number" maxlength="32" th:value="${number}" placeholder="LS-0000000001"></label>
<label>Статус<select name="status"><option value="">Все</option><option value="OPEN" th:selected="${status == 'OPEN'}">Открыт</option><option value="SUSPENDED" th:selected="${status == 'SUSPENDED'}">Приостановлен</option><option value="CLOSED" th:selected="${status == 'CLOSED'}">Закрыт</option></select></label>
<label>ID клиента<input name="clientId" th:value="${clientId}" placeholder="UUID"></label><button type="submit">Найти</button></form>
<div class="table-wrap"><table><thead><tr><th>Номер</th><th>Клиент</th><th>Открыт</th><th>Статус</th><th>Сальдо, ₽</th></tr></thead><tbody>
<tr th:each="a : ${accounts.content}"><td><a th:href="@{/accounts/{id}(id=${a.id})}" th:text="${a.accountNumber}"></a></td><td><a th:href="@{/clients/{id}(id=${a.clientId})}" th:text="${a.clientName}"></a></td><td th:text="${a.openedOn}"></td><td th:text="${a.status == 'OPEN' ? 'Открыт' : (a.status == 'SUSPENDED' ? 'Приостановлен' : 'Закрыт')}"></td><td th:text="${a.currentBalance}"></td></tr>
<tr th:if="${accounts.empty}"><td colspan="5">Счета не найдены.</td></tr></tbody></table></div>
<div class="pager"><a th:if="${accounts.hasPrevious()}" th:href="@{/accounts(number=${number},status=${status},clientId=${clientId},page=${accounts.number - 1})}">Назад</a><span th:text="|Страница ${accounts.number + 1} из ${accounts.totalPages == 0 ? 1 : accounts.totalPages}|"></span><a th:if="${accounts.hasNext()}" th:href="@{/accounts(number=${number},status=${status},clientId=${clientId},page=${accounts.number + 1})}">Далее</a></div>
</main></body></html>
