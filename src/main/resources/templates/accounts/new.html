<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Открыть счёт', false)}"></head>
<body><div th:replace="~{fragments/layout :: shell('Открыть счёт', 'accounts', ~{::main})}"><main id="main-content" class="page-content">
    <div class="page-heading"><div><h1>Открыть лицевой счёт</h1><p class="text-secondary">Номер присвоится автоматически после открытия.</p></div><a class="btn btn-outline-secondary" th:href="@{/clients/{id}(id=${client.id})}">К карточке клиента</a></div>
    <p th:replace="~{fragments/ui :: alert('danger', ${formError})}"></p>
    <p th:replace="~{fragments/ui :: alert('warning', ${client.status == 'ARCHIVED' ? 'Сначала восстановите клиента из архива.' : null})}"></p>
    <section class="card form-card"><div class="card-header"><h2 class="card-title">Данные нового счёта</h2></div><div class="card-body">
        <dl class="details-list"><div><dt>Клиент</dt><dd th:text="${client.displayName}"></dd></div><div><dt>Начальное сальдо</dt><dd class="money">0,00 ₽</dd></div><div><dt>Валюта</dt><dd>Российский рубль</dd></div></dl>
        <form th:if="${client.status == 'ACTIVE'}" method="post" th:action="@{/clients/{id}/accounts/new(id=${client.id})}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="openingId" th:value="${openingId}">
            <div class="form-grid"><div th:replace="~{fragments/ui :: field('openedOn', 'openedOn', 'Дата открытия', 'date', ${openedOn}, true, 'Дата начала истории нового счёта.')}"></div></div>
            <div class="action-bar form-actions"><button class="btn btn-primary" type="submit">Открыть счет</button><a class="btn btn-outline-secondary" th:href="@{/clients/{id}(id=${client.id})}">Отмена</a></div>
        </form>
    </div></section>
</main></div></body></html>
